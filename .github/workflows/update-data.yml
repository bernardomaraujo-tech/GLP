name: Update GPL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-gpl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment info
        run: |
          python --version
          pip --version
          node --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt não encontrado"
            exit 1
          fi

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Create debug folders
        run: |
          mkdir -p debug
          mkdir -p data

      - name: Fetch CSV
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_dgeg.py

      - name: List generated files
        if: always()
        run: |
          echo "Conteúdo da pasta data:"
          ls -la data || true
          echo ""
          echo "Conteúdo da pasta debug:"
          ls -la debug || true

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ || true
          git add debug/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "Update GPL data"
            git push
          fi
