name: Update GPL dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install pandas playwright

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Export DGEG CSV
        run: python scripts/export_dgeg_csv.py

      - name: Build stations dataset
        run: python scripts/build_dataset.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/Postos.csv data/stations.json
          git commit -m "Auto update GPL dataset" || echo "No changes"
          git push
