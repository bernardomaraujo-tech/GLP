name: Update GPL dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas lxml beautifulsoup4 html5lib

      - name: Build dataset
        run: python scripts/build_dataset.py

      - name: Ensure cache file exists
        run: |
          mkdir -p data
          test -f data/geocode_cache.json || echo "{}" > data/geocode_cache.json

      - name: Commit dataset and cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/stations.json
          git add data/geocode_cache.json
          git commit -m "Auto update GPL dataset" || echo "No changes"
          git push
