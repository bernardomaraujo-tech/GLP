name: Update GPL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment info
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GPL/requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Create folders
        run: |
          mkdir -p GPL/debug
          mkdir -p GPL/data

      - name: Run script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python GPL/scripts/fetch_dgeg.py

      - name: Debug listing
        if: always()
        run: |
          echo "Data:"
          ls -la GPL/data || true
          echo ""
          echo "Debug:"
          ls -la GPL/debug || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            GPL/debug/**
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GPL/data/ || true
          git add GPL/debug/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Update GPL data"
            git push
          fi
