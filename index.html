<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEM PLANO • GPL Portugal</title>
  <meta name="theme-color" content="#f6efe6" />
  <meta name="description" content="Postos GPL em Portugal com mapa, postos mais próximos, pesquisa por localidade, raio e ligação direta ao Waze." />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/SemPlanoJustRide.png" alt="SEM PLANO" class="brand-logo" />
        <div class="brand-copy">
          <div class="eyebrow">SEM PLANO</div>
          <h1>GPL Portugal</h1>
          <p>Postos perto de ti, preços de referência e acesso direto à rota no Waze.</p>
        </div>
      </div>
      <div class="pill-group">
        <div class="pill"><span class="pill-label">Atualização</span><strong id="generatedAt">—</strong></div>
        <div class="pill"><span class="pill-label">Fonte</span><strong id="sourceLabel">glpautogas + myLPG</strong></div>
      </div>
    </header>

    <main class="layout">
      <section class="panel filters-panel">
        <div class="section-title-row">
          <h2>Pesquisa</h2>
          <button id="refreshLocationBtn" class="btn btn-soft" type="button">Atualizar localização</button>
        </div>

        <div class="search-row">
          <input id="locationSearch" type="text" placeholder="Pesquisar localidade, cidade ou morada" autocomplete="off" />
          <button id="searchBtn" class="btn btn-primary" type="button">Procurar localização</button>
          <button id="clearBtn" class="btn btn-soft" type="button">Limpar</button>
        </div>

        <div class="filter-grid">
          <label>
            <span>Zona</span>
            <select id="zoneSelect">
              <option value="all">Todas</option>
              <option value="norte">Norte</option>
              <option value="centro">Centro</option>
              <option value="lisboa-vt">Lisboa e Vale do Tejo</option>
              <option value="alentejo">Alentejo</option>
              <option value="algarve">Algarve</option>
            </select>
          </label>

          <label>
            <span>Distrito</span>
            <select id="districtSelect">
              <option value="all">Todos</option>
            </select>
          </label>

          <label>
            <span>Marca</span>
            <select id="brandSelect">
              <option value="all">Todas</option>
            </select>
          </label>

          <label>
            <span>Raio</span>
            <select id="radiusSelect">
              <option value="10">10 km</option>
              <option value="25">25 km</option>
              <option value="50" selected>50 km</option>
              <option value="75">75 km</option>
              <option value="100">100 km</option>
              <option value="150">150 km</option>
              <option value="9999">Sem limite</option>
            </select>
          </label>

          <label>
            <span>Ordenar</span>
            <select id="sortSelect">
              <option value="distance">Distância</option>
              <option value="price">Preço</option>
              <option value="updated">Atualização</option>
              <option value="name">Nome</option>
            </select>
          </label>
        </div>

        <div class="stats-grid">
          <article class="stat-card">
            <span class="stat-label">Postos visíveis</span>
            <strong id="visibleCount">0</strong>
          </article>
          <article class="stat-card">
            <span class="stat-label">Mais barato no raio</span>
            <strong id="cheapestCard">—</strong>
          </article>
          <article class="stat-card">
            <span class="stat-label">Centro da pesquisa</span>
            <strong id="searchCenterLabel">A localizar…</strong>
          </article>
        </div>
      </section>

      <section class="panel map-panel">
        <div class="section-title-row">
          <h2>Mapa</h2>
          <div class="map-legend">
            <span><i class="dot dot-user"></i>Tu</span>
            <span><i class="dot dot-station"></i>Posto GPL</span>
          </div>
        </div>
        <div id="map" aria-label="Mapa dos postos GPL"></div>
      </section>

      <section class="panel results-panel">
        <div class="section-title-row">
          <h2>10 mais próximos</h2>
          <button id="cheapestBtn" class="btn btn-soft" type="button">Mais barato no raio</button>
        </div>
        <div id="results" class="results-list"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
