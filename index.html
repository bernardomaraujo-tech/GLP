<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPL Portugal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

<header class="header">
  <div class="brand">
    <img src="logo.png" alt="SEM PLANO" class="logo">
    <div>
      <h1>GPL Portugal</h1>
      <p>Postos perto de ti e preços atualizados</p>
    </div>
  </div>
</header>

<div class="controls">
  <input id="search" placeholder="Ex: Cascais, Viseu">
  <button onclick="searchLocation()">Procurar</button>
  <button onclick="reset()">Limpar</button>
  <button onclick="useLocation()">Usar a minha localização</button>
</div>

<div id="map"></div>

<div class="info">
  Última atualização: <span id="update-date">-</span>
</div>

<div id="results"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
