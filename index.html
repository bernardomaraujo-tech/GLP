<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPL Portugal — SEM PLANO</title>
  <meta name="theme-color" content="#e8efe9" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="SEM PLANO" class="brand-logo" />
        <div>
          <div class="eyebrow">SEM PLANO</div>
          <h1>GPL Portugal</h1>
          <p>Postos perto de ti, preços e acesso direto ao Waze</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel hero">
        <div class="hero-row">
          <div>
            <div class="muted-label">Dados</div>
            <div id="source-summary" class="source-summary">A carregar…</div>
          </div>
          <div class="update-box">
            <div class="muted-label">Última atualização</div>
            <div id="update-date" class="update-date">-</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Total postos</span>
            <strong id="stat-total">-</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Com coordenadas</span>
            <strong id="stat-coords">-</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Com preço</span>
            <strong id="stat-price">-</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Mais barato no raio</span>
            <strong id="stat-cheapest">-</strong>
          </div>
        </div>
      </section>

      <section class="panel filters-panel">
        <div class="toolbar">
          <input id="search" type="text" placeholder="Pesquisar localidade, município, marca ou posto" />
          <button id="btn-search" class="btn btn-primary">Procurar localização</button>
          <button id="btn-reset" class="btn">Limpar</button>
          <button id="btn-location" class="btn">Usar a minha localização</button>
        </div>

        <div class="filters-grid">
          <label>
            <span>Raio</span>
            <select id="radius">
              <option value="10">10 km</option>
              <option value="25">25 km</option>
              <option value="50" selected>50 km</option>
              <option value="75">75 km</option>
              <option value="100">100 km</option>
              <option value="200">200 km</option>
            </select>
          </label>

          <label>
            <span>Zona</span>
            <select id="zone">
              <option value="">Todas</option>
              <option value="norte">Norte</option>
              <option value="centro">Centro</option>
              <option value="lisboa">Lisboa e Vale do Tejo</option>
              <option value="alentejo">Alentejo</option>
              <option value="algarve">Algarve</option>
            </select>
          </label>

          <label>
            <span>Distrito</span>
            <select id="district">
              <option value="">Todos</option>
            </select>
          </label>

          <label>
            <span>Marca</span>
            <select id="brand">
              <option value="">Todas</option>
            </select>
          </label>

          <label>
            <span>Ordenar</span>
            <select id="sort-by">
              <option value="distance">Distância</option>
              <option value="price">Preço</option>
              <option value="name">Nome</option>
            </select>
          </label>
        </div>
      </section>

      <section class="layout-grid">
        <section class="panel map-panel">
          <div id="map"></div>
        </section>

        <section class="panel list-panel">
          <div class="list-header">
            <h2>Postos</h2>
            <button id="btn-cheapest" class="btn btn-soft">Mais barato no raio</button>
          </div>
          <div id="results" class="results"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
